# branches.conf -- contract mapping for the closure adapter (P2.2).
#
# One mapping per line:
#     <kanban tasks.branch_name> -> <owner>/<repo>
#
# A task whose branch_name is absent here (or missing entirely) is
# deliberately NOT completable through the `kanban_complete` gate tool:
# the adapter fails closed with "no contract". The escalation path is the
# owner updating this mapping, not a worker bypass.
#
# Lines starting with '#' are comments; whitespace is trimmed.
#
# Example (active): slice tasks live on branch `codex/<slice-id>` and gate
# against this repo:
codex/slice-x -> NEO-Venturez/wf-fix-test
#
# P2.3 integration test rows (2026-08-09; removable after the run):
ab8b004b662fa6537fad66ff53e2224657404ff7 -> NEO-Venturez/wf-fix-test
does-not-exist-xyz -> NEO-Venturez/wf-fix-test
